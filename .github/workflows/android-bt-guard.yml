name: BT-Wächter APK

on:
  push:
    paths:
      - "android-bt-guard/**"
      - ".github/workflows/android-bt-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bt-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One signing key for all builds, so a new APK installs as an update
      # instead of requiring the old app (and its log) to be removed first.
      - uses: actions/cache@v4
        with:
          path: ~/btguard-debug.keystore
          key: bt-waechter-debug-keystore-v2

      - name: Create signing key on first run
        run: |
          [ -f ~/btguard-debug.keystore ] || keytool -genkeypair -noprompt \
            -keystore ~/btguard-debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK
        run: |
          chmod +x gradlew
          BTGUARD_DEBUG_KEYSTORE="$HOME/btguard-debug.keystore" ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk bt-waechter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bt-waechter-apk
          path: android-bt-guard/bt-waechter.apk

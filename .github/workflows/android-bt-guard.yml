name: BT-Wächter APK

on:
  push:
    paths:
      - "android-bt-guard/**"
      - ".github/workflows/android-bt-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bt-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Keep the debug signing key between runs, so a new build installs as
      # an update instead of requiring the old app to be uninstalled first.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bt-waechter-debug-keystore

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk bt-waechter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bt-waechter-apk
          path: android-bt-guard/bt-waechter.apk
